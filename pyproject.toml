[project]
name = "specrag"
version = "0.1.0"
description = "Retrieval over UK building regulations, with a measured evaluation harness"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# src layout: without this, importing specrag needs PYTHONPATH=src, which is
# easy to have exported locally and absent in CI.
pythonpath = ["src"]
markers = [
    "network: hits the live gov.uk API (deselect with -m 'not network')",
    "slow: loads the embedding model (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
