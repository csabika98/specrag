name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The CPU wheel is ~200MB rather than ~2.5GB; nothing here needs CUDA.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      # The suite is offline by design: the retrieval path runs against a
      # deterministic hashing embedder, so no model is downloaded and a
      # failure points at this code rather than at a model release.
      - name: Test
        run: pytest -m "not network and not slow" --cov=specrag --cov-report=term-missing
